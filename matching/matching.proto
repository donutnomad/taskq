syntax = "proto3";
package matching;
option go_package = "github.com/donutnomad/taskq/matching";

import "google/protobuf/timestamp.proto";

// MatchingService 是分区级任务队列的 gRPC 端点。
// 每个 matching 节点只服务哈希环分配给自己的分区。
service MatchingService {
    rpc AddTask(AddTaskRequest) returns (AddTaskResponse);
    rpc PollTask(PollTaskRequest) returns (PollTaskResponse);
    rpc PollQueue(PollQueueRequest) returns (PollQueueResponse);
    rpc AckTask(AckTaskRequest) returns (AckTaskResponse);
    rpc NackTask(NackTaskRequest) returns (NackTaskResponse);
    rpc GetQueueInfo(GetQueueInfoRequest) returns (GetQueueInfoResponse);
}

message AddTaskRequest {
    string queue_name = 1;
    int32 partition_id = 2;
    bytes data = 3;
    string routing_key = 4;
    google.protobuf.Timestamp routing_deadline = 5;
}
message AddTaskResponse {}

message PollTaskRequest {
    string queue_name = 1;
    int32 partition_id = 2;
    int64 poll_timeout_ms = 3; // 0=非阻塞，>0=长轮询毫秒数
    repeated string accepted_routing_keys = 4;
}
message PollTaskResponse {
    bool empty = 1;    // true=无任务
    bytes data = 2;
    string token = 3;  // ack/nack 用的 token
    string routing_key = 4;
    google.protobuf.Timestamp routing_deadline = 5;
    bool routing_fallback = 6;
}

message PollQueueRequest {
    string queue_name = 1;
    repeated int32 partition_ids = 2;
    int64 poll_timeout_ms = 3;
    repeated string accepted_routing_keys = 4;
}
message PollQueueResponse {
    bool empty = 1;
    int32 partition_id = 2;
    bytes data = 3;
    string token = 4;
    string routing_key = 5;
    google.protobuf.Timestamp routing_deadline = 6;
    bool routing_fallback = 7;
}

message AckTaskRequest {
    string queue_name = 1;
    int32 partition_id = 2;
    string token = 3;
}
message AckTaskResponse {}

message NackTaskRequest {
    string queue_name = 1;
    int32 partition_id = 2;
    string token = 3;
    // undelivered=true 表示任务从未交付给消费者（例如 frontend 多 owner 扇出后
    // 归还非获胜 owner 的租约），只归还租约、不计 attempt、不重写新行。
    bool undelivered = 4;
}
message NackTaskResponse {}

message GetQueueInfoRequest {
    string queue_name = 1;
}
message GetQueueInfoResponse {
    // num_partitions 向后兼容旧 frontend，等于 num_read_partitions。
    int32 num_partitions = 1;
    int32 num_read_partitions = 2;
    int32 num_write_partitions = 3;
}
